name: Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check functions/api/schedule.js
          node --check tools/now-markers.test.js

      - name: Test «now» markers (день тижня, поточний урок)
        run: node tools/now-markers.test.js

      - name: Validate manifest.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"


